id = "grokbot-notify"
name = "Grok Bot Notify"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Wake a Grok Bot routine (webhook) when any herdr-detected coding agent finishes, needs input, or exits; optionally forward other herdr events."
platforms = ["linux", "macos"]

# Every hookable herdr 0.9.5 plugin event is registered so it can be enabled
# from config without editing this file. notify.sh exits immediately for any
# event not listed in GROKBOT_NOTIFY_EVENTS (default: agent signals only).
[[events]]
on = "pane.agent_status_changed"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.updated"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.renamed"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.moved"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.reordered"
command = ["bash", "notify.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "notify.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "notify.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "notify.sh"]

[[events]]
on = "worktree.removed"
command = ["bash", "notify.sh"]

[[events]]
on = "tab.created"
command = ["bash", "notify.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "notify.sh"]

[[events]]
on = "tab.renamed"
command = ["bash", "notify.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "notify.sh"]

[[events]]
on = "tab.focused"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.created"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "notify.sh"]

[[actions]]
id = "test"
title = "Grok Bot Notify: send test webhook"
command = ["bash", "notify.sh", "--test"]

[[actions]]
id = "status"
title = "Grok Bot Notify: show config summary"
command = ["bash", "notify.sh", "--status"]

[[actions]]
id = "enable"
title = "Grok Bot Notify: enable"
command = ["bash", "notify.sh", "--enable"]

[[actions]]
id = "disable"
title = "Grok Bot Notify: disable"
command = ["bash", "notify.sh", "--disable"]

[[panes]]
id = "setup"
title = "Grok Bot Notify setup"
placement = "popup"
width = "70%"
height = 24
command = ["bash", "setup.sh"]
