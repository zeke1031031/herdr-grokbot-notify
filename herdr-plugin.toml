id = "grokbot-notify"
name = "Grok Bot Notify"
version = "0.3.0"
min_herdr_version = "0.9.5"
description = "Wake a Grok Bot routine (webhook) when any herdr-detected coding agent finishes, needs input, or exits; optionally forward other herdr events."
platforms = ["linux", "macos"]

# Only the agent signals are registered here, so by default herdr starts a hook
# process for nothing else. Optional events (workspace.*, worktree.*, tab.*,
# pane.created/closed/moved) are registered by `configure.sh --events +...`,
# which generates a small companion plugin (<id>-events) in the config dir.
# This file is never rewritten, so `git pull` / `herdr plugin update` stay clean.
[[events]]
on = "pane.agent_status_changed"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "notify.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "notify.sh"]

[[actions]]
id = "test"
title = "Grok Bot Notify: send test webhook"
command = ["bash", "notify.sh", "--test"]

[[actions]]
id = "status"
title = "Grok Bot Notify: show config summary"
command = ["bash", "notify.sh", "--status"]

[[actions]]
id = "enable"
title = "Grok Bot Notify: enable"
command = ["bash", "notify.sh", "--enable"]

[[actions]]
id = "disable"
title = "Grok Bot Notify: disable"
command = ["bash", "notify.sh", "--disable"]

[[actions]]
id = "apply"
title = "Grok Bot Notify: re-apply optional event hooks"
command = ["bash", "configure.sh", "--apply"]

[[panes]]
id = "setup"
title = "Grok Bot Notify setup"
placement = "popup"
width = "70%"
height = 24
command = ["bash", "setup.sh"]
